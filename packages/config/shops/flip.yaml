slug: flip
name: "Flip"
domain: flip.ro
website_url: https://flip.ro
hosts: [flip.ro]
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [telefoane, refurbished]
legal:
  basis_ref: "robots.txt allows product pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows account, cart and tracking-parameter URLs."
shipping:
  flat: 19.99
  locker_flat: 11.99
  notes: "Curier 19,99 lei, locker 11,99 lei; livrare gratuită doar pentru membrii eMAG Genius (datele paginii de produs, `shippingCosts`, citite 2026-10-27). JSON-LD-ul paginii declară 0 lei, în contradicție cu pagina: nu este folosit."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 1500
  # ≈6,900 product pages at 1,000 a day: every offer is re-read about once a week.
  freshness_slo_hours: 192
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), honest UA"
    result: served
    note: "robots 200"
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "product page 200 (JSON-LD UsedCondition, sku per grade/colour/storage; __NEXT_DATA__ with grade, stock, previous price, delivery prices)"
notes: "Refurbished phones with warranty, in grades (Bun, Foarte bun, Excelent, Ca nou) chosen with ?shape=; a page without it shows its default grade, the only one recorded. Parser flip-product: condition refurbished (JSON-LD says used), grade in raw.grade, crossed price = Flip's stated 30-day minimum. Never in the main (new) minimum."
sources:
  - key: flip:sitemap:produse
    kind: sitemap
    url: https://flip.ro/sitemap.xml
    parser_key: sitemap
    schedule: "15 2 * * *"
    enabled: true
    freshness_slo_hours: 192
    config:
      productParser: flip-product
      dailyBudget: 1000
      note: "Single sitemap with ≈6,900 product URLs; product pages read with flip-product (M10)."
