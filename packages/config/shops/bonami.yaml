# Bonami — home and living e-shop (Czech group, Next.js). M10 (2026-10-27): only the two
# small-appliance categories are listed; the rest of the catalogue (furniture, decor) is outside
# the launch categories.
slug: bonami
name: "Bonami"
domain: bonami.ro
website_url: https://www.bonami.ro
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [casa, electrocasnice-mici]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /profil, /admin, /comanda/, /cos, /cautati?q (with exceptions), /c/*,* (filter combinations), /*priceRange, sort variants. Category pages and ?p=N allowed."
shipping:
  notes: "Pagina https://www.bonami.ro/c/livrare (citită 2026-10-27) își încarcă tarifele în browser; în HTML nu apare niciun cost. Necunoscut."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 1000
  freshness_slo_hours: 26
affiliate:
  network: "2performant"
  comparator_policy: "unknown"
  status: "to_apply"
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "robots, home, delivery page 200; /c/aparate-de-bucatarie 200 (__NEXT_DATA__: 48 of 93 products, 181 with colour variants)"
notes: "Listing data in __NEXT_DATA__ (exact money amounts, crossed retailPrice, stock, brand). JSON-LD with gtin only on product pages; publishes product_dead sitemaps (delisting signal). Mostly furniture and decor: low value for the launch categories."
sources:
  - key: bonami:listing:aparate-de-bucatarie
    kind: listing
    url: https://www.bonami.ro/c/aparate-de-bucatarie
    parser_key: bonami-listing
    schedule: "30 3 * * *"
    enabled: true
    freshness_slo_hours: 26
    config:
      max_pages: 5
      label: "Electrocasnice de bucătărie"
      tier: B
  - key: bonami:listing:electrocasnice-pentru-curatenie
    kind: listing
    url: https://www.bonami.ro/c/electrocasnice-pentru-curatenie
    parser_key: bonami-listing
    schedule: "35 3 * * *"
    enabled: true
    freshness_slo_hours: 26
    config:
      max_pages: 3
      label: "Electrocasnice pentru curățenie"
      tier: B
