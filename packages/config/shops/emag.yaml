# eMAG — the largest Romanian shop and marketplace host.
# ADR-013: isolated source behind a kill switch. Founder decision of 2026-10-27 (Daniel): option A,
# polite identified crawl of category listings + Tier A product pages; no images, no internal APIs
# (sapi.emag.ro), stop on the first written request. The DB flag `source.emag.enabled` must also be on.
slug: emag
name: eMAG
domain: emag.ro
website_url: https://www.emag.ro
hosts: [www.emag.ro]
kind: marketplace_host
status: active
access_mode: direct
trust_tier: 1
categories: [electronice, it, electrocasnice]
legal:
  basis_ref: "ADR-013; founder decision 2026-10-27 (option A), docs/progress.md"
  terms_note: "Terms §4.2(j) forbid automated extraction and §6.2 republishing without written consent; accepted civil risk per the founders' decision; lawyer review before public launch (B5)."
  robots_note: "robots.txt allows category (/…/c) and product (/…/pd/…) pages; disallows /product/, /search-tools/*, /ajax_live_products, cart and account pages. Responses vary by User-Agent: re-read with the production UA."
shipping:
  notes: "Livrare gratuită peste un prag pentru produsele vândute de eMAG; curier altfel; easybox. Valori de verificat."
  verified: false
warranty_months_default: 24
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 3500
  freshness_slo_hours: 26
affiliate:
  network: profitshare
  comparator_policy: forbidden
  status: none
  notes: "eMAG's own Profitshare program excludes comparators and browser plugins: plain links only."
notes: "Crossed price = eMAG's lowest price of the last 30 days; PRP is the manufacturer's recommended price (never a reference). Marketplace sellers (evoMAG, VEXIO, Flanco, …) appear as separate offers on product pages."
