    parser_key: elefant-listing
    schedule: "37 5 * * *"
    enabled: false
    freshness_slo_hours: 26
    config:
      discovery: true
      max_pages: 5
      label: "Self-help (descoperire)"
  - key: elefant:listing:biografii-memorii
    kind: listing
    url: https://www.elefant.ro/list/carti/carte/biografii-si-memorii
    parser_key: elefant-listing
