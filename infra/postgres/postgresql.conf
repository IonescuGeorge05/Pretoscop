# PostgreSQL 18 settings for staging and production (infra/docker-compose.prod.yml starts the server
# with `-c config_file=/etc/postgresql/postgresql.conf`). Memory sizes and archive_mode differ per
# environment and are passed as `-c` flags from the server's .env (PG_SHARED_BUFFERS, ...), which
# override the values below. Data stays in $PGDATA (/var/lib/postgresql/18/docker), with its
# pg_hba.conf and postgresql.auto.conf (pgBackRest writes recovery settings there on restore).

listen_addresses = '*'
max_connections = 200
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# --- Memory (defaults for a small box; production overrides: shared_buffers 16GB on 64 GB RAM) ---
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 32MB
maintenance_work_mem = 512MB
huge_pages = try

# --- Storage (NVMe) ------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200

# --- Parallelism ---------------------------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 6
max_parallel_maintenance_workers = 2

# --- WAL, checkpoints and archiving (pgBackRest; ADR-016) ---------------------------------------
wal_level = replica
wal_compression = zstd
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# archive_mode is set per environment (-c archive_mode=on in production, off in staging), because
# an archive_command that keeps failing makes pg_wal grow without bound.
archive_mode = off
archive_command = 'pgbackrest --stanza=pretoscop archive-push %p'
# A WAL segment is shipped at least every 5 minutes: the most data a lost server can cost (RPO).
archive_timeout = 300
max_wal_senders = 3

# --- Autovacuum (append-heavy price_events partitions, upsert-heavy offers) -----------------------
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_max_workers = 4

# --- Observability ---------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
log_temp_files = 64MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '
