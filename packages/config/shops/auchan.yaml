# Auchan — hypermarket chain on VTEX IO. M10 (2026-10-27): electronics and appliance category
# pages, read from the page's embedded VTEX state (EAN, price, list price, stock). The VTEX catalogue
# JSON API is public and allowed by robots.txt but is not used: HTML pages are enough and an API
# call would need a founder decision (terms not reviewed).
slug: auchan
name: "Auchan"
domain: auchan.ro
website_url: https://www.auchan.ro
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [electronice, electrocasnice]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /account/, /checkout/, /busca/, /*?map=, /*?order=, /*?query= (and & forms); explicitly allows /*?page=. The site's own pagination links use ?map= (disallowed): the parser builds ?page=N instead."
shipping:
  notes: "Livrarea depinde de metoda aleasă (domiciliu, ridicare) și de localitate; «costurile de transport și taxele sunt calculate la Coș» (pagina de categorie, 2026-10-27). Necunoscut."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 1000
  freshness_slo_hours: 26
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "robots, sitemap index, category sitemap 200; /…/televizoare → 301 /…/televizoare/c?v=bot (bot rendering) 200, 4.4 MB: 24 products in the state, only 4 priced (in stock), 117 in the category; ?page=2 200 with 0 priced"
notes: "Online electronics range is small and mostly unavailable (Price 0 in the state = not sold online): such products are skipped and the listing stops at the first page without a priced product. Brand field unreliable (TCL televisions carry the supplier 'AEC'); EAN on every SKU."
sources:
