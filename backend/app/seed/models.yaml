  family: PlayStation 5
  edition: disc
  storage_gb: 825
  model_code: CFI-1xxx
  ean: null
  image_url: null
  msrp_eur: 649.99  # msrp_ron = msrp_eur x EUR_RON (app/seed/load.py)
  msrp_verified: false
  msrp_note: "preț UE PS5 cu disc din 02.04.2026; modelul original nu mai e produs, se folosește ediția actuală"
