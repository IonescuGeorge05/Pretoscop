# Variantele PlayStation 5. Fiecare = un `product`, grupate sub `family`.
# EAN-urile NU sunt inventate: rămân null până le găsește un scraper (JSON-LD gtin13).
# model_code: prefix verificat la nivel de generație; "x" = cifră necunoscută (de verificat per regiune).
# msrp_ron: prețul recomandat Sony pentru Europa (EUR), în vigoare din 2 aprilie 2026
#           (https://blog.playstation.com/2026/03/27/new-price-changes-for-ps5-ps5-pro-and-playstation-portal-remote-player/),
#           convertit cu cursul EUR_RON din app/seed/load.py și rotunjit la x9. Sony nu publică un preț separat în lei -> rămâne „estimat”.
#           Modelele originale (CFI-1xxx) nu mai sunt produse: folosim MSRP-ul ediției echivalente actuale.
- slug: ps5-disc-825gb
  name: PlayStation 5 Standard (cu unitate disc), 825 GB
  family: PlayStation 5
  edition: disc
  storage_gb: 825
  model_code: CFI-1xxx
  ean: null
  image_url: null
  msrp_eur: 649.99  # msrp_ron = msrp_eur x EUR_RON (app/seed/load.py)
  msrp_verified: false
  msrp_note: "preț UE PS5 cu disc din 02.04.2026; modelul original nu mai e produs, se folosește ediția actuală"

