# IT Galaxy — IT and electronics shop (custom PHP platform, template shared with Vexio).
# M10 (2026-10-27): category listings replace the sitemap → product-page sweep. A listing page
# carries 36 products with price, crossed price, stock and often the EAN; the sitemap path needed
# one request per product (~94k products: a 60-day cycle at the daily budget).
slug: itgalaxy
name: "IT Galaxy"
domain: itgalaxy.ro
website_url: https://www.itgalaxy.ro
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [it, electronice, electrocasnice]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /data/feeds/*, /feeds*, /ajax/*, /cos/, /compara/*, /alerta-*, /*/pret-*-pana-la-*/*; category pages and /paginaN/ allowed."
shipping:
  notes: "Costul livrării se calculează în coș, după adresă și modalitatea de plată (https://www.itgalaxy.ro/info/comanda-si-livrare/modalitati-livrare/, citit 2026-10-27). Necunoscut până la verificare."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 2000
  freshness_slo_hours: 26
affiliate:
  network: "profitshare"
  commission_text: "2–10% (Oct 2026)"
  comparator_policy: "unknown"
  status: "to_apply"
probes:
  - date: "2026-10-27"
    vantage: "London, honest UA (research 2026-10-27)"
    result: served
    note: "robots, sitemap, product 200"
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), honest UA"
    result: served
    note: "robots, sitemap index, product 200"
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "/televizoare/ listing 200: 36 products, 19 pages, EAN in the card on 10 of 36; delivery page 200 (cost computed in the cart)"
notes: "Listing cards: id (= product-page JSON-LD sku), title, price and crossed price in Romanian format, stock text, EAN ('Cod EAN') on many cards. Crossed price is the shop's reference, not a stated 30-day minimum. Shares a template with Vexio."
sources:
  - key: itgalaxy:sitemap:produse
    kind: sitemap
    url: https://www.itgalaxy.ro/data/sitemaps/index.xml
    parser_key: sitemap
    schedule: "15 2 * * *"
    enabled: false
    config:
      productParser: jsonld-product
      dailyBudget: 1500
      include: ["/data/sitemaps/products"]
      note: "Disabled in M10: superseded by the category listings (36 offers per request instead of 1). Keep for discovery of products outside the listed categories if ever needed."
  - key: itgalaxy:listing:telefoane-mobile
    kind: listing
    url: https://www.itgalaxy.ro/telefoane-mobile/
    parser_key: itgalaxy-listing
    schedule: "15 2 * * *"
    enabled: true
    freshness_slo_hours: 26
    config:
      max_pages: 40
      label: "Telefoane mobile"
      tier: B
