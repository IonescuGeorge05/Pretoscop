# forit — IT shop (Cloudflare in front; served the identified bot on 2026-10-27).
# M10 (2026-10-27): category listings replace the sitemap sweep. A listing page publishes a JSON-LD
# ItemList of 60 Products with offers (price, stock, the offer's own delivery cost), read by the
# generic parser; the sitemap children (~30k URLs and ~16.7 MB each, above the fetcher's 15 MiB cap)
# would have needed one request per product.
slug: forit
name: "forit"
domain: forit.ro
website_url: https://www.forit.ro
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [it, electronice, electrocasnice]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /lib/, /account/, /checkout/, /cauta/, /*_f*/, /*/filtre/; Crawl-delay 10 only for named AI agents. Category pages and /<cat>/pN/c pagination allowed."
shipping:
  notes: "Fiecare ofertă își declară costul de livrare în JSON-LD (OfferShippingDetails: 21,99 lei sub un prag, 0 lei peste; observat 2026-10-27); se folosește valoarea ofertei, nu o regulă a magazinului."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 2000
  freshness_slo_hours: 26
affiliate:
  network: "profitshare"
  commission_text: "2% (Oct 2026)"
  comparator_policy: "unknown"
  status: "to_apply"
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), honest UA"
    result: served
    note: "robots and sitemap index 200"
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "/Televizoare/ → 301 /televizoare/ listing 200 (JSON-LD ItemList, 60 products, rel=next /televizoare/p2/c); product page 200 (JSON-LD sku = mpn, shippingRate)"
notes: "JSON-LD Product, sku = manufacturer code (also on listings), no GTIN. Offers state their delivery cost. Titles in JSON-LD carry HTML entities (32&quot;), decoded by the extractor."
sources:
  - key: forit:sitemap:produse
    kind: sitemap
    url: https://www.forit.ro/sitemap.xml
    parser_key: sitemap
    schedule: "15 2 * * *"
    enabled: false
    config:
      productParser: jsonld-product
      dailyBudget: 1500
      exclude: ["sitemap_category"]
      note: "Disabled in M10: superseded by the category listings (60 offers per request); its numbered children exceed the 15 MiB fetch cap."
  - key: forit:listing:smartphone
    kind: listing
    url: https://www.forit.ro/smartphone/
    parser_key: jsonld-product
    schedule: "20 2 * * *"
    enabled: true
    freshness_slo_hours: 26
    config:
      max_pages: 30
      label: "Smartphone"
      tier: B
  - key: forit:listing:tablete
    kind: listing
    url: https://www.forit.ro/tablete/
