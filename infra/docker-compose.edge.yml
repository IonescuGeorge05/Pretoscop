# Edge stack (M18, ADR-019): Caddy terminates TLS for production and staging and load-balances
# each environment's two web replicas. Separate from the app stacks so that deploying either
# environment never restarts the proxy. Start it once, from the production checkout:
#   docker network create pretoscop-edge   # once per server (deploy.sh also creates it)
#   docker compose -p pretoscop-edge -f infra/docker-compose.edge.yml --env-file .env up -d
# Both app stacks join the same external network; Caddy reaches them by <env>-web-1/2 aliases.
name: pretoscop-edge

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # Not PID 1 (orphaned health-check children are reaped by tini); exec-form check, generous timeout.
    init: true
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9180/metrics']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    ports:
      - '${EDGE_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}'
      - '${EDGE_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}'
      - '${EDGE_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-pretoscop.ro}
      STAGING_DOMAIN: ${STAGING_DOMAIN:-staging.pretoscop.ro}
      CADDY_TLS: ${CADDY_TLS:-internal}
      ACME_EMAIL: ${ACME_EMAIL:-admin@pretoscop.ro}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      # Cloudflare's published ranges (https://www.cloudflare.com/ips/, checked 2026-10-27).
      TRUSTED_PROXIES: >-
        ${TRUSTED_PROXIES:-173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18
        108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15
        104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32
        2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32}
      PROD_UPSTREAMS: ${PROD_UPSTREAMS:-prod-web-1:3000 prod-web-2:3000}
      STAGING_UPSTREAMS: ${STAGING_UPSTREAMS:-staging-web-1:3000 staging-web-2:3000}
      PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-stats.pretoscop.ro}
      PLAUSIBLE_UPSTREAM: ${PLAUSIBLE_UPSTREAM:-prod-plausible:8000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin CA certificate and key (never in git; see infra/cloudflare/README.md).
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - edge
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

networks:
  # Owned by neither stack (external in all three files): created once with
  # `docker network create pretoscop-edge` (deploy.sh does it when missing), so that removing or
  # recreating one stack never disconnects the others.
  edge:
    external: true
    name: ${EDGE_NETWORK:-pretoscop-edge}

volumes:
  caddydata:
  caddyconfig:
