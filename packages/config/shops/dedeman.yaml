# Dedeman — DIY chain with a large appliance range (Magento).
# M10 (2026-10-27): appliance and TV category listings (up to 72 offers per request). The product
# sitemap stays disabled: its URLs carry no category, so it would crawl the whole DIY catalogue.
slug: dedeman
name: "Dedeman"
domain: dedeman.ro
website_url: https://www.dedeman.ro
kind: retail
status: active
access_mode: direct
trust_tier: 1
categories: [electrocasnice, bricolaj]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /catalog/, /catalogsearch/, /checkout/, /customer/, /api/, /xapiv2, /*?p=*&, /*SID=. Category pages and ?page=N allowed."
shipping:
  locker_flat: 11
  notes: "Ridicare din locker: cost fix 11,0 lei (primele 20 kg). Curier pentru produse mici și flota Dedeman pentru produse mari, cu cost estimat după adresă («Estimare cost livrare»); ridicare din magazin pentru comenzi online peste 50 lei. Sursa: https://www.dedeman.ro/ro/comenzi-online/modalitati-de-livrare (citit 2026-10-27). Costul de curier/flotă rămâne necunoscut."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 1500
  freshness_slo_hours: 26
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), honest UA"
    result: served
    note: "robots, listing, product 200"
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "sitemap index and categories sitemap 200 (2,584 categories); /ro/frigidere/c/1147 listing 200 (23 products, 2 with a crossed 'Super Preț'); delivery page 200"
notes: "Listing cards: product code (= /p/<code>), Magento price amounts (decimal), crossed price only on discounted cards, stock line as worded. Large appliances say 'Verifică disponibilitatea online' (stock depends on the locality): recorded as unknown availability, so they are shown but not used for the in-stock minimum. Prices per piece; unit-priced cards are skipped."
sources:
  - key: dedeman:sitemap:produse
    kind: sitemap
    url: https://www.dedeman.ro/media/sitemap/sitemap.xml
    parser_key: sitemap
    schedule: "15 2 * * *"
    enabled: false
    config:
      productParser: jsonld-product
      dailyBudget: 800
      note: "Disabled: product URLs carry no category, so the sweep would cover the whole DIY catalogue. The appliance listings below replace it."
  - key: dedeman:listing:frigidere
    kind: listing
    url: https://www.dedeman.ro/ro/frigidere/c/1147
