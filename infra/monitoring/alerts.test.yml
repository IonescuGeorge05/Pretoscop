# Unit tests for alerts.yml (M18): synthetic series in, expected alerts out. They prove that each rule
# fires on the failure it is written for and stays quiet when things are fine. Series carry the labels
# Grafana Alloy adds (`job`, `env`; config.alloy). Run by `make verify M=18`:
#   docker run --rm -v "$PWD/infra/monitoring:/rules:ro" --entrypoint promtool prom/prometheus:v3.7.3 test rules /rules/alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # WAL archiving stalled: nothing archived for more than 30 minutes.
  - interval: 1m
    input_series:
      - series: 'pretoscop_pg_archive_mode_on{job="pretoscop-worker", env="prod"}'
        values: '1x60'
      - series: 'pretoscop_pg_last_archived_timestamp_seconds{job="pretoscop-worker", env="prod"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: WalArchivingFailing
        exp_alerts: []
      - eval_time: 45m
        alertname: WalArchivingFailing
        exp_alerts:
          - exp_labels: { severity: critical, job: pretoscop-worker, env: prod }
            exp_annotations: { summary: 'WAL archiving to the pgBackRest repository is failing or stalled', runbook: infra/runbooks/restore.md }

  # WAL archiving failing: the last failure is newer than the last success (archive-push errors).
  - interval: 1m
    input_series:
      - series: 'pretoscop_pg_archive_mode_on{job="pretoscop-worker", env="prod"}'
        values: '1x30'
      - series: 'pretoscop_pg_last_archived_timestamp_seconds{job="pretoscop-worker", env="prod"}'
        values: '0+60x30'
      - series: 'pretoscop_pg_last_archive_failure_timestamp_seconds{job="pretoscop-worker", env="prod"}'
        values: '30+60x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: WalArchivingFailing
        exp_alerts:
          - exp_labels: { severity: critical, job: pretoscop-worker, env: prod }
            exp_annotations: { summary: 'WAL archiving to the pgBackRest repository is failing or stalled', runbook: infra/runbooks/restore.md }

  # Archiving healthy (segments shipped every minute, an old failure) or off (staging): no alert.
  - interval: 1m
    input_series:
      - series: 'pretoscop_pg_archive_mode_on{job="pretoscop-worker", env="prod"}'
        values: '1x60'
      - series: 'pretoscop_pg_last_archived_timestamp_seconds{job="pretoscop-worker", env="prod"}'
        values: '0+60x60'
      - series: 'pretoscop_pg_last_archive_failure_timestamp_seconds{job="pretoscop-worker", env="prod"}'
        values: '100x60'
      - series: 'pretoscop_pg_archive_mode_on{job="pretoscop-worker", env="staging"}'
        values: '0x60'
      - series: 'pretoscop_pg_last_archived_timestamp_seconds{job="pretoscop-worker", env="staging"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: WalArchivingFailing
        exp_alerts: []

  # Nightly pg_dump missing for more than 26 hours; the weekly restore test is not due yet.
  - interval: 1m
    input_series:
      - series: 'pretoscop_job_last_success_timestamp_seconds{job="pretoscop-worker", env="prod", queue="backup.nightly"}'
        values: '0x1700'
      - series: 'pretoscop_job_last_success_timestamp_seconds{job="pretoscop-worker", env="prod", queue="backup.restore_test"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 1500m
        alertname: NightlyDumpMissing
        exp_alerts: []
      - eval_time: 1600m
        alertname: NightlyDumpMissing
        exp_alerts:
          - exp_labels: { severity: critical, job: pretoscop-worker, env: prod, queue: backup.nightly }
            exp_annotations: { summary: 'No nightly pg_dump for more than 26 hours', runbook: infra/runbooks/restore.md }
      - eval_time: 1600m
        alertname: LogicalRestoreTestMissing
        exp_alerts: []

  # A live source past its freshness SLO (+2 h grace) and failing twice in a row alerts; a source that
  # is switched off does not.
  - interval: 1m
    input_series:
      - series: 'pretoscop_crawl_enabled{job="pretoscop-worker", env="prod"}'
        values: '1x40'
      - series: 'pretoscop_source_live{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '1x40'
      - series: 'pretoscop_source_last_success_age_seconds{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '100000+60x40'
      - series: 'pretoscop_source_freshness_slo_seconds{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '86400x40'
      - series: 'pretoscop_source_consecutive_failures{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '2x40'
      - series: 'pretoscop_crawl_enabled{job="pretoscop-worker", env="staging"}'
        values: '0x40'
      - series: 'pretoscop_source_live{job="pretoscop-worker", env="staging", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '1x40'
      - series: 'pretoscop_source_last_success_age_seconds{job="pretoscop-worker", env="staging", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '900000x40'
      - series: 'pretoscop_source_freshness_slo_seconds{job="pretoscop-worker", env="staging", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '86400x40'
      - series: 'pretoscop_source_live{job="pretoscop-worker", env="prod", source="emag:product", shop="emag", kind="product"}'
        values: '0x40'
      - series: 'pretoscop_source_last_success_age_seconds{job="pretoscop-worker", env="prod", source="emag:product", shop="emag", kind="product"}'
        values: '900000x40'
      - series: 'pretoscop_source_freshness_slo_seconds{job="pretoscop-worker", env="prod", source="emag:product", shop="emag", kind="product"}'
        values: '86400x40'
      - series: 'pretoscop_source_consecutive_failures{job="pretoscop-worker", env="prod", source="emag:product", shop="emag", kind="product"}'
        values: '5x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: SourceStale
        exp_alerts:
          - exp_labels: { severity: warning, job: pretoscop-worker, env: prod, source: 'forit:listing:laptopuri', shop: forit, kind: listing }
            exp_annotations: { summary: 'Source forit:listing:laptopuri is past its freshness SLO', runbook: infra/runbooks/source-pause.md }
      - eval_time: 30m
        alertname: SourceFailing
        exp_alerts:
          - exp_labels: { severity: warning, job: pretoscop-worker, env: prod, source: 'forit:listing:laptopuri', shop: forit, kind: listing }
            exp_annotations: { summary: 'Source forit:listing:laptopuri failed 2 times in a row', runbook: infra/runbooks/source-pause.md }

  # Crawling switched off: stale sources are expected, no freshness alert.
  - interval: 1m
    input_series:
      - series: 'pretoscop_crawl_enabled{job="pretoscop-worker", env="prod"}'
        values: '0x40'
      - series: 'pretoscop_source_live{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '1x40'
      - series: 'pretoscop_source_last_success_age_seconds{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '100000+60x40'
      - series: 'pretoscop_source_freshness_slo_seconds{job="pretoscop-worker", env="prod", source="forit:listing:laptopuri", shop="forit", kind="listing"}'
        values: '86400x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: SourceStale
        exp_alerts: []

  # Fewer than 95% of active offers observed within 26 h.
  - interval: 1m
    input_series:
      - series: 'pretoscop_offers_active{job="pretoscop-worker", env="prod", shop="forit"}'
        values: '1000x80'
      - series: 'pretoscop_offers_checked_26h{job="pretoscop-worker", env="prod", shop="forit"}'
        values: '900x80'
      - series: 'pretoscop_offers_active{job="pretoscop-worker", env="staging", shop="forit"}'
        values: '1000x80'
      - series: 'pretoscop_offers_checked_26h{job="pretoscop-worker", env="staging", shop="forit"}'
        values: '1000x80'
    alert_rule_test:
      - eval_time: 70m
        alertname: OfferFreshnessLow
        exp_alerts:
          - exp_labels: { severity: warning, env: prod }
            exp_annotations: { summary: 'Fewer than 95% of active offers were observed in the last 26 h' }

  # Origin 5xx rate above 0.5% (here about 9%), and origin p95 latency above 400 ms.
  - interval: 1m
    input_series:
      - series: 'caddy_http_requests_total{job="caddy", env="prod", host="pretoscop.ro", code="200"}'
        values: '0+600x40'
      - series: 'caddy_http_requests_total{job="caddy", env="prod", host="pretoscop.ro", code="502"}'
        values: '0+60x40'
      - series: 'caddy_http_request_duration_seconds_bucket{job="caddy", env="prod", host="pretoscop.ro", le="0.25"}'
        values: '0+60x40'
      - series: 'caddy_http_request_duration_seconds_bucket{job="caddy", env="prod", host="pretoscop.ro", le="1"}'
        values: '0+600x40'
      - series: 'caddy_http_request_duration_seconds_bucket{job="caddy", env="prod", host="pretoscop.ro", le="+Inf"}'
        values: '0+660x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: WebErrorRateHigh
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: 'More than 0.5% of requests reaching the origin fail with 5xx', runbook: infra/runbooks/incident.md }
      - eval_time: 40m
        alertname: WebLatencyHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: 'Origin p95 latency above 400 ms for 30 minutes (Cloudflare-cached hits are not counted)', runbook: infra/runbooks/incident.md }

  # No worker metrics at all (worker down, or Alloy down), and a nearly full disk.
  - interval: 1m
    input_series:
      - series: 'pretoscop_disk_free_bytes{job="pretoscop-worker", env="prod", path="/app/data"}'
        values: '10x40'
      - series: 'pretoscop_disk_size_bytes{job="pretoscop-worker", env="prod", path="/app/data"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkerMetricsAbsent
        exp_alerts:
          - exp_labels: { severity: critical, job: pretoscop-worker }
            exp_annotations: { summary: 'No metrics from the worker for 10 minutes (worker down, or Alloy down)', runbook: infra/runbooks/incident.md }
      - eval_time: 30m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels: { severity: critical, job: pretoscop-worker, env: prod, path: /app/data }
            exp_annotations: { summary: 'Less than 15% free disk on the server', runbook: infra/runbooks/incident.md }

  # A healthy worker: build info present, plenty of disk.
  - interval: 1m
    input_series:
      - series: 'pretoscop_build_info{job="pretoscop-worker", env="prod", version="v2026.11.10-1", app_env="prod"}'
        values: '1x40'
      - series: 'pretoscop_disk_free_bytes{job="pretoscop-worker", env="prod", path="/app/data"}'
        values: '80x40'
      - series: 'pretoscop_disk_size_bytes{job="pretoscop-worker", env="prod", path="/app/data"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkerMetricsAbsent
        exp_alerts: []
      - eval_time: 30m
        alertname: DiskSpaceLow
        exp_alerts: []

  # The weekly logical restore test has not passed for more than 8 days.
  - interval: 1m
    input_series:
      - series: 'pretoscop_job_last_success_timestamp_seconds{job="pretoscop-worker", env="prod", queue="backup.restore_test"}'
        values: '0x11600'
    alert_rule_test:
      - eval_time: 8d
        alertname: LogicalRestoreTestMissing
        exp_alerts: []
      - eval_time: 8d1h
        alertname: LogicalRestoreTestMissing
        exp_alerts:
          - exp_labels: { severity: warning, job: pretoscop-worker, env: prod, queue: backup.restore_test }
            exp_annotations: { summary: 'The weekly restore test of the nightly dump has not passed for 8 days', runbook: infra/runbooks/restore.md }

  # A pg-boss backlog in production alerts per environment and queue; staging's smaller one does not
  # (and is never added to production's).
  - interval: 1m
    input_series:
      - series: 'pretoscop_queue_jobs{job="pretoscop-worker", env="prod", queue="match.pending", state="created"}'
        values: '1500x40'
      - series: 'pretoscop_queue_jobs{job="pretoscop-worker", env="prod", queue="match.pending", state="active"}'
        values: '5000x40'
      - series: 'pretoscop_queue_jobs{job="pretoscop-worker", env="staging", queue="match.pending", state="created"}'
        values: '600x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: QueueBacklog
        exp_alerts:
          - exp_labels: { severity: warning, env: prod, queue: match.pending }
            exp_annotations: { summary: 'pg-boss queue match.pending has 1500 waiting jobs', runbook: infra/runbooks/scale-workers.md }

  # Review queue above 500 for 6 hours; the worker's event loop lagging for 15 minutes.
  - interval: 1m
    input_series:
      - series: 'pretoscop_review_queue_offers{job="pretoscop-worker", env="prod"}'
        values: '600x420'
      - series: 'nodejs_eventloop_delay_p99_seconds{job="pretoscop-worker", env="prod"}'
        values: '1.5x420'
    alert_rule_test:
      - eval_time: 5h
        alertname: ReviewQueueLarge
        exp_alerts: []
      - eval_time: 7h
        alertname: ReviewQueueLarge
        exp_alerts:
          - exp_labels: { severity: info, job: pretoscop-worker, env: prod }
            exp_annotations: { summary: 'Match review queue holds 600 offers (SLO < 500)' }
      - eval_time: 20m
        alertname: WorkerEventLoopLag
        exp_alerts:
          - exp_labels: { severity: warning, job: pretoscop-worker, env: prod }
            exp_annotations: { summary: 'Worker event loop p99 delay above 1 s for 15 minutes', runbook: infra/runbooks/scale-workers.md }

  # Assisted-access spend (M05B): production at 87% of its cap alerts; staging's own small spend and
  # an environment whose cap is 0 (channel never configured) do not, and production's spend is never
  # compared with staging's cap (one-to-one per env).
  - interval: 1m
    input_series:
      - series: 'pretoscop_assisted_spend_month_cents{job="pretoscop-worker", env="prod"}'
        values: '13000x20'
      - series: 'pretoscop_assisted_cap_cents{job="pretoscop-worker", env="prod"}'
        values: '15000x20'
      - series: 'pretoscop_assisted_spend_month_cents{job="pretoscop-worker", env="staging"}'
        values: '500x20'
      - series: 'pretoscop_assisted_cap_cents{job="pretoscop-worker", env="staging"}'
        values: '15000x20'
      - series: 'pretoscop_assisted_spend_month_cents{job="pretoscop-worker", env="dev"}'
        values: '0x20'
      - series: 'pretoscop_assisted_cap_cents{job="pretoscop-worker", env="dev"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: AssistedSpendNearCap
        exp_alerts: []
      - eval_time: 10m
        alertname: AssistedSpendNearCap
        exp_alerts:
          - exp_labels: { severity: warning, env: prod }
            exp_annotations: { summary: 'Assisted-access spend at 13000 cents, 80% or more of the monthly cap (hard stop at 100%)', runbook: infra/runbooks/assisted-access.md }

  # Assisted-access success (M05B): a shop below 90% over 7 days for 6 hours alerts, a healthy one
  # does not.
  - interval: 1m
    input_series:
      - series: 'pretoscop_assisted_success_ratio_7d{job="pretoscop-worker", env="prod", shop="altex"}'
        values: '0.85x420'
      - series: 'pretoscop_assisted_success_ratio_7d{job="pretoscop-worker", env="prod", shop="flanco"}'
        values: '0.97x420'
    alert_rule_test:
      - eval_time: 5h
        alertname: AssistedSuccessLow
        exp_alerts: []
      - eval_time: 7h
        alertname: AssistedSuccessLow
        exp_alerts:
          - exp_labels: { severity: warning, job: pretoscop-worker, env: prod, shop: altex }
            exp_annotations: { summary: 'Assisted access to altex: 85% success over 7 days (SLO 90%; auto-pause after 7 days below 80%)', runbook: infra/runbooks/assisted-access.md }
