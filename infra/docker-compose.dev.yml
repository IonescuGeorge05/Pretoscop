# Local development services. Started by `make services` / `make dev`.
# Data lives in named volumes; `make down` keeps it, `make nuke` deletes it.
name: pretoscop

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: pretoscop
      POSTGRES_PASSWORD: pretoscop
      POSTGRES_DB: pretoscop
      TZ: UTC
    command: >-
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=200
      -c timezone=UTC
      -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=2000
    ports:
      - '${PG_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pretoscop -d pretoscop']
      interval: 2s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key-change-me-0123456789}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:7700/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '5000'
    ports:
      - '8025:8025'
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  # Long-running recorder (M05): `docker compose -f infra/docker-compose.dev.yml -p pretoscop --profile recorder up -d --build`
  worker:
    profiles: [recorder]
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://pretoscop:pretoscop@postgres:5432/pretoscop
      MEILI_URL: http://meilisearch:7700
      SMTP_URL: smtp://mailpit:1025
      BLOB_FS_ROOT: /app/data/blobs
      PUBLIC_BASE_URL: http://host.docker.internal:3000
    volumes:
      - ../data:/app/data
    ports:
      - '9464:9464'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Self-hosted Plausible Community Edition (M17) ------------------------------------------
  # Web analytics the site loads only after the visitor clicks "Accept" (ADR-010). NOT started by
  # default; start and stop it explicitly:
  #   docker compose -f infra/docker-compose.dev.yml -p pretoscop --profile analytics up -d
  #   docker compose -f infra/docker-compose.dev.yml -p pretoscop --profile analytics stop
  # RAM: ClickHouse + Plausible + their Postgres need about 2 GB (the Plausible CE README asks for
  # at least 2 GB); stop the profile on an 8 GB laptop when you do not need it.
  # Dashboard: http://localhost:8100 (the first account you register becomes the owner; add the
  # site "localhost"). Then build the web app with
  #   NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=http://localhost:8100/js/script.js NEXT_PUBLIC_PLAUSIBLE_DOMAIN=localhost
  # Services and ClickHouse settings mirror plausible/community-edition v3.2.1 (infra/plausible/).
  plausible_db:
    profiles: [analytics]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - plausible_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 1m

  plausible_events_db:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: '1'
    volumes:
      - plausible_events:/var/lib/clickhouse
      - plausible_event_logs:/var/log/clickhouse-server
      - ./plausible/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./plausible/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./plausible/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./plausible/clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 1m

  plausible:
    profiles: [analytics]
    image: ghcr.io/plausible/community-edition:v3.2.1
    restart: unless-stopped
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    environment:
      TMPDIR: /var/lib/plausible/tmp
      BASE_URL: ${PLAUSIBLE_BASE_URL:-http://localhost:8100}
      # Development placeholder (at least 64 bytes). Production: `openssl rand -base64 48`, kept in
      # the server .env, never in git.
      SECRET_KEY_BASE: ${PLAUSIBLE_SECRET_KEY_BASE:-dev-only-insecure-plausible-secret-key-base-change-me-0123456789abcdef}
      HTTP_PORT: '8000'
      DATABASE_URL: postgres://postgres:postgres@plausible_db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
    volumes:
      - plausible_data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - '${PLAUSIBLE_PORT:-8100}:8000'

volumes:
  pgdata:
  meilidata:
  plausible_db:
  plausible_events:
  plausible_event_logs:
  plausible_data:
