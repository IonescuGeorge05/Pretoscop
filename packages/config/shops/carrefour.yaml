# Carrefour — hypermarket chain; non-food online catalogue on Magento 2 (theme "CarrefourMarketplace",
# products sold by Carrefour). M10 (2026-10-27): TV, phone, IT, gaming and appliance listings
# (24 offers per request, ?p=N).
slug: carrefour
name: "Carrefour"
domain: carrefour.ro
website_url: https://carrefour.ro
hosts: [carrefour.ro, www.carrefour.ro]
kind: retail
status: active
access_mode: direct
trust_tier: 2
categories: [electronice, it, electrocasnice]
legal:
  basis_ref: "robots.txt allows product and category pages; recon 2026-10-27 served the honest bot"
  robots_note: "Disallows /customer, /new_checkout, /wishlist, /mycarrefour, /catalogsearch, /*&|*, /*fbclid*, /*order=*, /*]=*, /catalog/product, /*ajax/. Category pages and ?p=N allowed."
shipping:
  notes: "Nicio pagină publică de livrare găsită în meniu la 2026-10-27; costul se vede în coș. Necunoscut până la verificare."
  verified: false
crawl_policy:
  min_interval_ms: 5000
  max_pages_per_day: 1000
  freshness_slo_hours: 26
probes:
  - date: "2026-10-27"
    vantage: "founder home connection (Mac), PretoscopBot via @pretoscop/fetch (M10)"
    result: served
    note: "robots 200; home 200; televizoare-smart listing 200 (24 of 81 products, rel=next ?p=2, 17 with a crossed price); product page 200 (JSON-LD sku = card code, no EAN on this page)"
notes: "Listing cards: article code (= JSON-LD sku and URL tail), price in meta[itemprop=price], crossed price rebuilt from its spans, brand and availability on the add-to-cart button. A card's wishlist link carries another product's data and is never read. EAN only via Flixmedia on some product pages."
