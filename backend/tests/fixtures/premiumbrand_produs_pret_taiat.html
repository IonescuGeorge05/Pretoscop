editie limitata (unul din cele 30 de modele posibile);\r\n \tAgrafa PlayStation.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nConsola PS5 dezlantuie noi posibilitati de gaming pe care nu le-ai anticipat niciodata.\r\n\r\nExperimenteaza incarcare de mare viteza cu un SSD ultra-rapid, imersiune mai profunda datorita compatibilitatii cu functia de feedback haptic, declansatoare adaptive si sunet 3D2, precum si o noua generatie de jocuri PlayStation incredibile.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nDesign Slim\r\n\r\nCu PS5, te poti bucura de tehnologie de gaming puternica intr-un design de consola elegant si compact.\r\n\r\n1TB spatiu de stocare\r\n\r\nPastreaza jocurile preferate mereu la indemana si fii gata sa te conectezi si sa joci, cu 1TB spatiu de stocare pe SSD incorporat.3\r\n\r\nSSD Ultra-Rapid\u00a0\r\n\r\nMaximizeaza-ti sesiunile de joc datorita timpului de incarcare aproape instantaneu pentru jocurile PS5 instalate.\r\n\r\nPerformanta integrata I/O\r\n\r\nIntegrarea personalizata a sistemelor consolei PS5 le permite creatorilor de continut sa transfere date din SSD atat de rapid, incat pot dezvolta jocuri in moduri nemaivazute pana acum.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nRay Tracing\u00a0\r\n\r\nBucura-te de o imersiune completa in lumi cu un nou nivel de realism, in care razele de lumina sunt reproduse individual, creand umbre si reflexii realiste, in jocurile PS5 compatibile.\r\n\r\nGaming 4K pe TV\u00a0\r\n\r\nJoaca titlurile favorite PS5 pe uimitoarele televizoare 4K.\r\n\r\nPana la 120fps cu o rata de refresh de 120Hz\u00a0\r\n\r\nBucura-te de gameplay rapid si fluid la un numar ridicat de cadre pe secunda de pana la 120 fps pentru jocurile compatibile, cu suport pentru o rata de refresh de 120Hz pe display-urile 4K.\r\n\r\nTehnologia HDR\u00a0\r\n\r\nCu un televizor cu tehnologia HDR, jocurile compatibile PS5 sunt afisate in game de culori incredibil de vibrante si naturale.\r\n\r\nTehnologie audio Tempest 3D\r\n\r\nBucura-te de o imersiune deplina in peisaje sonore in care sunetul pare ca vine din toate directiile. Mediul din jurul tau prinde viata cu Tempest 3D AudioTech2, pentru jocurile compatibile.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nFeedback Haptic\r\n\r\nExperimenteaza feedback-ul haptic al controlerului fara fir DualSense in anumite jocuri PS5 si simte efectele actiunilor tale si fiecare impact, datorita feedback-ului senzorial dinamic.\r\n\r\nDeclansatoare adaptive\r\n\r\nSimte actiunea cu declansatoarele adaptive imersive, cu niveluri dinamice de rezistenta ce simuleaza impactul fizic al activitatilor din joc, pentru anumite titluri PS5.\r\n\r\nContine jocul ASTRO\u2019S Playroom\r\n\r\nExploreaza patru lumi diferite, fiecare caracterizata de gameplay inovator, folosind functionalitatile versatile ale controlerului fara fir DualSense, in acest joc inclus pentru toti utilizatorii de console PS5.\r\n\r\nCompatibilitate cu jocurile din generatia anterioara &amp;amp; Game Boost\r\n\r\nConsola PS5 poate rula peste 4.000 de jocuri PS4. Datorita functionalitatii Game Boost, te poti bucura de o experienta mai rapida, mai fluida si de mai multe cadre pe secunda in unele dintre cele mai indragite jocuri lansate pe consola PS4.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n*Consola PS5 Digital Edition (CFI-2000 categorie model \u2013 slim)\r\n\r\n2Sunet 3D redat prin boxele incorporate in televizor sau prin casti audio stereo analoage/USB. Sunt necesare configurarea si actualizarea la cea mai recenta versiune de software.\r\n\r\n3O parte a SSD-ului este alocata sistemului software si altor functii, asadar capacitatea efectiva disponibila a SSD-ului poate varia.\r\n\r\n4Este necesara o conexiune la Internet pentru conectarea si configurarea unitatii disc si a consolei PS5.\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\nGarantie comerciala persoane juridice:\u00a012 luni\r\n\r\n\r\n\r\n\r\n\r\n\r\nGarantie de conformitate persoane fizice:\u00a024 luni\r\n\r\n\r\n\r\n\r\n\r\n\r\nInclude taxa verde:\u00a02,00\u00a0lei\
